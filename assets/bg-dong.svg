<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyDong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3e9f7"/>
      <stop offset="55%" stop-color="#d6dcf0"/>
      <stop offset="100%" stop-color="#c7cdea"/>
    </linearGradient>
    <radialGradient id="moonDong" cx="30%" cy="20%" r="22%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eef1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eef1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softDong"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#skyDong)"/>
  <circle cx="230" cy="90" r="100" fill="url(#moonDong)"/>
  <circle cx="230" cy="90" r="46" fill="#fbfcff"/>

  <!-- distant snow mountains -->
  <path d="M0 240 L90 160 L170 230 L260 130 L360 235 L460 150 L560 240 L660 170 L760 235 L800 210 V450 H0 Z" fill="#9aa4d6" opacity="0.4" filter="url(#softDong)"/>
  <path d="M0 280 L110 200 L210 270 L320 180 L430 275 L540 195 L650 275 L760 210 L800 250 V450 H0 Z" fill="#7480c0" opacity="0.4" filter="url(#softDong)"/>
  <!-- snow caps -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M90 160 L70 195 H110 Z"/><path d="M260 130 L235 170 H285 Z"/>
    <path d="M460 150 L438 187 H482 Z"/><path d="M660 170 L638 205 H682 Z"/>
  </g>

  <!-- temple with snow roof -->
  <g transform="translate(480,240)">
    <path d="M0 60 L100 10 L200 60 Z" fill="#3c3a5c"/>
    <path d="M0 60 L100 10 L200 60 L188 66 L100 22 L12 66 Z" fill="#f4f6ff"/>
    <rect x="20" y="60" width="160" height="70" fill="#4a4870"/>
    <rect x="45" y="80" width="30" height="50" fill="#2f2d50"/>
    <rect x="125" y="80" width="30" height="50" fill="#2f2d50"/>
    <path d="M-10 130 H210" stroke="#2f2d50" stroke-width="5"/>
  </g>

  <!-- snow ground -->
  <path d="M0 380 Q200 355 400 375 T800 365 V450 H0 Z" fill="#eef1fb" opacity="0.9"/>

  <!-- falling snow -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="60" cy="80" r="2.5"/><circle cx="140" cy="200" r="2"/><circle cx="330" cy="60" r="2.3"/>
    <circle cx="410" cy="180" r="2"/><circle cx="560" cy="90" r="2.4"/><circle cx="700" cy="150" r="2"/>
    <circle cx="760" cy="60" r="2.2"/><circle cx="30" cy="250" r="2"/><circle cx="620" cy="230" r="2.2"/>
    <circle cx="380" cy="280" r="2"/><circle cx="180" cy="300" r="2.3"/>
  </g>

  <!-- plum blossom branch, bottom-left corner -->
  <g stroke="#5b3a4a" stroke-width="3" fill="none" opacity="0.9">
    <path d="M-10 450 Q40 400 30 340 Q55 310 50 260"/>
  </g>
  <g fill="#f3c6da">
    <circle cx="35" cy="325" r="6"/><circle cx="20" cy="360" r="5"/><circle cx="52" cy="280" r="6"/>
    <circle cx="48" cy="400" r="5"/><circle cx="10" cy="420" r="5"/>
  </g>
</svg>
