<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyThu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f3a"/>
      <stop offset="55%" stop-color="#2a2650"/>
      <stop offset="100%" stop-color="#3a2a3f"/>
    </linearGradient>
    <radialGradient id="moonThu" cx="80%" cy="12%" r="14%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb54d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb54d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softThu"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#skyThu)"/>
  <circle cx="640" cy="55" r="90" fill="url(#moonThu)"/>
  <circle cx="640" cy="55" r="30" fill="#fff8e6"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="40" r="1.6"/><circle cx="150" cy="70" r="1.3"/><circle cx="260" cy="30" r="1.6"/>
    <circle cx="340" cy="90" r="1.2"/><circle cx="430" cy="45" r="1.5"/><circle cx="510" cy="20" r="1.3"/>
    <circle cx="60" cy="110" r="1.3"/><circle cx="220" cy="110" r="1.2"/>
  </g>

  <!-- distant rooftop silhouette -->
  <path d="M0 260 L40 230 L80 260 L120 220 L170 260 L220 235 L270 260 L320 225 L370 260 L420 240 L470 260 L520 220 L570 260 L620 235 L670 260 L720 230 L800 260 V450 H0 Z" fill="#171a30" opacity="0.85"/>
  <!-- nearer rooftop silhouette -->
  <path d="M0 320 L60 280 L110 320 L160 275 L220 320 L280 285 L340 320 L400 270 L460 320 L520 285 L580 320 L640 275 L700 320 L760 285 L800 315 V450 H0 Z" fill="#0e1024"/>

  <!-- glowing windows -->
  <g fill="#ffcf7a" opacity="0.85">
    <rect x="55" y="300" width="10" height="14" rx="1"/>
    <rect x="150" y="300" width="10" height="14" rx="1"/>
    <rect x="330" y="300" width="10" height="14" rx="1"/>
    <rect x="450" y="300" width="10" height="14" rx="1"/>
    <rect x="600" y="300" width="10" height="14" rx="1"/>
    <rect x="700" y="300" width="10" height="14" rx="1"/>
  </g>

  <!-- hanging red lanterns along a line -->
  <g>
    <line x1="0" y1="245" x2="800" y2="245" stroke="#4a3a2a" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(120,245)"><line x1="0" y1="0" x2="0" y2="14" stroke="#4a3a2a"/><ellipse cx="0" cy="26" rx="13" ry="16" fill="#c94c3f"/><rect x="-3" y="8" width="6" height="6" fill="#4a3a2a"/></g>
    <g transform="translate(300,245)"><line x1="0" y1="0" x2="0" y2="14" stroke="#4a3a2a"/><ellipse cx="0" cy="26" rx="13" ry="16" fill="#c94c3f"/><rect x="-3" y="8" width="6" height="6" fill="#4a3a2a"/></g>
    <g transform="translate(480,245)"><line x1="0" y1="0" x2="0" y2="14" stroke="#4a3a2a"/><ellipse cx="0" cy="26" rx="13" ry="16" fill="#c94c3f"/><rect x="-3" y="8" width="6" height="6" fill="#4a3a2a"/></g>
    <g transform="translate(660,245)"><line x1="0" y1="0" x2="0" y2="14" stroke="#4a3a2a"/><ellipse cx="0" cy="26" rx="13" ry="16" fill="#c94c3f"/><rect x="-3" y="8" width="6" height="6" fill="#4a3a2a"/></g>
  </g>
  <g opacity="0.5">
    <circle cx="120" cy="271" r="24" fill="url(#lanternGlow)"/>
    <circle cx="300" cy="271" r="24" fill="url(#lanternGlow)"/>
    <circle cx="480" cy="271" r="24" fill="url(#lanternGlow)"/>
    <circle cx="660" cy="271" r="24" fill="url(#lanternGlow)"/>
  </g>

  <!-- floating sky lanterns -->
  <g opacity="0.9">
    <ellipse cx="230" cy="150" rx="12" ry="15" fill="#ffb84d"/>
    <rect x="226" y="163" width="8" height="4" fill="#7a4a1a"/>
    <ellipse cx="230" cy="150" rx="18" ry="22" fill="url(#lanternGlow)" opacity="0.4"/>
    <ellipse cx="420" cy="115" rx="10" ry="13" fill="#ffb84d"/>
    <ellipse cx="420" cy="115" rx="16" ry="19" fill="url(#lanternGlow)" opacity="0.4"/>
  </g>
</svg>
