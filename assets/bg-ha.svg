<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyHa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef7ee"/>
      <stop offset="50%" stop-color="#dcefe0"/>
      <stop offset="100%" stop-color="#c8e6d4"/>
    </linearGradient>
    <linearGradient id="rayHa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waterHa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6e2"/>
      <stop offset="100%" stop-color="#8fd0cb"/>
    </linearGradient>
    <filter id="softHa"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#skyHa)"/>

  <!-- back tree mass -->
  <path d="M0 210 Q100 150 220 195 Q320 140 420 190 Q520 145 620 195 Q720 155 800 200 V450 H0 Z" fill="#7fb894" opacity="0.55" filter="url(#softHa)"/>
  <!-- mid tree mass -->
  <path d="M0 260 Q110 210 240 250 Q350 205 460 250 Q580 210 690 255 T800 245 V450 H0 Z" fill="#5a9d72" opacity="0.7" filter="url(#softHa)"/>
  <!-- front canopy silhouettes, both sides framing -->
  <path d="M0 150 Q60 130 90 190 Q120 140 150 210 L150 0 L0 0 Z" fill="#3f7a54" opacity="0.85" filter="url(#softHa)"/>
  <path d="M800 150 Q740 130 710 190 Q680 140 650 210 L650 0 L800 0 Z" fill="#3f7a54" opacity="0.85" filter="url(#softHa)"/>

  <!-- hanging vines -->
  <g stroke="#4d8a64" stroke-width="2" opacity="0.6">
    <path d="M175 0 Q170 90 180 170" fill="none"/>
    <path d="M210 0 Q205 60 215 130" fill="none"/>
    <path d="M600 0 Q605 100 595 180" fill="none"/>
  </g>

  <!-- sun rays -->
  <polygon points="130,0 260,0 380,300 300,300" fill="url(#rayHa)"/>
  <polygon points="260,0 340,0 420,260 360,260" fill="url(#rayHa)"/>

  <!-- stream -->
  <path d="M340 450 Q330 380 360 320 Q390 260 370 200 Q355 150 380 90 Q400 40 385 0 L430 0 Q450 45 425 95 Q400 150 415 205 Q435 265 405 325 Q380 385 400 450 Z" fill="url(#waterHa)" opacity="0.85"/>
  <path d="M375 60 Q385 40 400 25" stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none"/>
  <path d="M370 190 Q385 170 400 155" stroke="#ffffff" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M365 320 Q380 300 398 285" stroke="#ffffff" stroke-width="2" opacity="0.5" fill="none"/>

  <!-- mist band -->
  <rect x="0" y="225" width="800" height="35" fill="#ffffff" opacity="0.4" filter="url(#softHa)"/>
  <rect x="0" y="300" width="800" height="30" fill="#ffffff" opacity="0.3" filter="url(#softHa)"/>
</svg>
