<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyXuan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbeaf2"/>
      <stop offset="55%" stop-color="#f3e0ec"/>
      <stop offset="100%" stop-color="#e6d3ea"/>
    </linearGradient>
    <radialGradient id="glowXuan" cx="75%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#fff6fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="softXuan"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softXuan2"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#skyXuan)"/>
  <rect width="800" height="450" fill="url(#glowXuan)"/>

  <!-- distant misty mountains -->
  <path d="M0 260 Q120 210 260 245 T520 230 T800 250 V450 H0 Z" fill="#cdb7d6" opacity="0.35" filter="url(#softXuan)"/>
  <path d="M0 300 Q150 260 320 285 T650 270 T800 290 V450 H0 Z" fill="#b99fc8" opacity="0.3" filter="url(#softXuan)"/>

  <!-- pavilion silhouette, mid-left -->
  <g transform="translate(70,215)" opacity="0.92">
    <path d="M0 55 L55 10 L110 55 Z" fill="#8a3b3b"/>
    <rect x="12" y="55" width="86" height="6" fill="#8a3b3b"/>
    <rect x="20" y="61" width="6" height="55" fill="#6b2e2e"/>
    <rect x="84" y="61" width="6" height="55" fill="#6b2e2e"/>
    <rect x="52" y="61" width="6" height="55" fill="#6b2e2e"/>
    <path d="M-8 116 H118" stroke="#6b2e2e" stroke-width="4"/>
  </g>

  <!-- water strip -->
  <rect x="0" y="330" width="800" height="120" fill="#eadcee" opacity="0.5"/>
  <path d="M0 345 Q200 335 400 345 T800 345" stroke="#ffffff" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M0 375 Q220 365 440 375 T800 372" stroke="#ffffff" stroke-width="2" opacity="0.4" fill="none"/>

  <!-- blossom branch, top-left drooping -->
  <g stroke="#5b3a3a" stroke-width="3" fill="none" opacity="0.9">
    <path d="M-10 0 Q40 40 30 110 Q60 140 55 200"/>
    <path d="M30 110 Q10 130 -20 140"/>
    <path d="M55 200 Q80 220 100 250"/>
  </g>
  <g fill="#f3a8c6">
    <circle cx="35" cy="95" r="7"/><circle cx="20" cy="130" r="6"/><circle cx="58" cy="150" r="7"/>
    <circle cx="8" cy="145" r="5"/><circle cx="70" cy="205" r="6"/><circle cx="95" cy="245" r="6"/>
    <circle cx="50" cy="230" r="5"/><circle cx="-5" cy="10" r="6"/><circle cx="15" cy="35" r="5"/>
  </g>
  <g fill="#fbd3e4">
    <circle cx="42" cy="100" r="3"/><circle cx="26" cy="135" r="3"/><circle cx="64" cy="155" r="3"/>
    <circle cx="76" cy="210" r="3"/><circle cx="100" cy="250" r="3"/>
  </g>

  <!-- blossom branch, top-right drooping -->
  <g stroke="#5b3a3a" stroke-width="3" fill="none" opacity="0.9">
    <path d="M810 0 Q750 50 760 120 Q730 150 735 210"/>
    <path d="M760 120 Q790 140 815 150"/>
  </g>
  <g fill="#f3a8c6">
    <circle cx="765" cy="105" r="7"/><circle cx="750" cy="140" r="6"/><circle cx="740" cy="185" r="6"/>
    <circle cx="790" cy="140" r="5"/><circle cx="730" cy="215" r="6"/><circle cx="800" cy="20" r="6"/>
  </g>
  <g fill="#fbd3e4">
    <circle cx="758" cy="112" r="3"/><circle cx="745" cy="150" r="3"/><circle cx="736" cy="195" r="3"/>
  </g>

  <!-- distant birds -->
  <g stroke="#5b4a5a" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M600 70 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M650 95 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- soft mist band -->
  <rect x="0" y="255" width="800" height="40" fill="#ffffff" opacity="0.35" filter="url(#softXuan2)"/>
</svg>
